# Phase 1: 2 players. Self-play (pool of past checkpoints) will be added later.
name: two_players
seed: 0
n_envs: 8
total_timesteps: 10_000_000

env:
  n_players: 2
  opponents:          # bot -> weight, drawn for each opponent seat at each reset
    random: 0.2
    heuristic: 0.4
    cautious: 0.4
  reward:
    scale: 20.0
    win_bonus: 1.0
  max_steps: 5000

ppo:
  n_steps: 256        # per env -> 8 x 256 = 2048 steps per rollout
  batch_size: 256
  n_epochs: 10
  gamma: 0.999
  gae_lambda: 0.95
  ent_coef: 0.01
  learning_rate: 3.0e-4
  clip_range: 0.2
  net_arch: [256, 256]

eval:
  freq: 200_000       # env steps between evaluations
  n_games: 200
  opponents: [heuristic, cautious]   # random only in the sanity check

checkpoint:
  freq: 500_000       # env steps between checkpoints

models_dir: models
logs_dir: logs
