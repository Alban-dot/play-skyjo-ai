# Sanity check: learn to beat the random bot (should go well above 50 %).
name: sanity_random
seed: 0
n_envs: 8
total_timesteps: 400_000

env:
  n_players: 2
  opponents:
    random: 1.0
  reward:
    scale: 20.0
    win_bonus: 1.0
  max_steps: 5000

ppo:
  n_steps: 256
  batch_size: 256
  n_epochs: 10
  gamma: 0.999
  gae_lambda: 0.95
  ent_coef: 0.01
  learning_rate: 3.0e-4
  clip_range: 0.2
  net_arch: [256, 256]

eval:
  freq: 50_000
  n_games: 200
  opponents: [random, heuristic, cautious]

checkpoint:
  freq: 100_000

models_dir: models
logs_dir: logs
