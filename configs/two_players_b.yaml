# A/B test, setting B: bigger rollouts (~85 games per update), lower learning rate.
# Same number of gradient steps as two_players.yaml (~78k over 2M steps). Everything else identical.
name: two_players_b
seed: 0
n_envs: 8
total_timesteps: 10_000_000

env:
  n_players: 2
  opponents:          # bot -> weight, drawn for each opponent seat at each reset
    random: 0.2
    heuristic: 0.4
    cautious: 0.4
  reward:
    scale: 20.0
    win_bonus: 1.0
  max_steps: 5000

ppo:
  n_steps: 1024       # per env -> 8 x 1024 = 8192 steps per rollout (A: 256)
  batch_size: 256
  n_epochs: 10
  gamma: 0.999
  gae_lambda: 0.95
  ent_coef: 0.01
  learning_rate: 2.0e-4   # A: 3.0e-4
  clip_range: 0.2
  net_arch: [256, 256]

eval:
  freq: 200_000       # env steps between evaluations
  n_games: 200
  opponents: [heuristic, cautious]   # random only in the sanity check

checkpoint:
  freq: 500_000       # env steps between checkpoints

models_dir: models
logs_dir: logs
